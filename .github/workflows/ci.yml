name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jobpilot_test:disposable-test-only@127.0.0.1:35432/jobpilot_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv --directory backend sync

      - name: Start isolated test database
        run: docker compose -f backend/compose.test.yaml up -d --wait

      - name: Run guarded test migrations
        run: uv --directory backend run python testing_environment.py migrate

      - name: Run backend tests
        run: uv --directory backend run pytest --basetemp pytest-cache-files-ci

      - name: Stop isolated test database
        if: always()
        run: docker compose -f backend/compose.test.yaml down

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
