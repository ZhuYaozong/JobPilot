[project]
name = "jobpilot-datasets"
version = "0.1.0"
description = "JobPilot LoRA、RAG 与模型实验数据生产工程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
qwen = [
    "accelerate>=1.12,<2",
    "torch>=2.8",
    "transformers>=4.57,<6",
]
documents = [
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "respx>=0.22,<1",
]

[project.scripts]
jobpilot-datasets = "jobpilot_datasets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_datasets"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
pythonpath = ["src"]
testpaths = ["tests"]
